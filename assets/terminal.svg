<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" width="620" height="360" role="img" aria-label="terminal about">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F52FF"/>
      <stop offset="100%" stop-color="#3670A0"/>
    </linearGradient>
  </defs>

  <rect x="6" y="6" width="608" height="348" rx="12" fill="#000000" opacity="0.3"/>
  <rect x="0" y="0" width="608" height="348" rx="10" fill="#11111b" stroke="#313244" stroke-width="2"/>

  <rect x="2" y="2" width="604" height="36" rx="8" fill="#1e1e2e"/>
  <rect x="2" y="28" width="604" height="10" fill="#1e1e2e"/>

  <circle cx="22" cy="20" r="6" fill="#f38ba8"/>
  <circle cx="42" cy="20" r="6" fill="#fab387"/>
  <circle cx="62" cy="20" r="6" fill="#a6e3a1"/>

  <text x="304" y="26" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#585b70">zsh — ~/profile</text>

  <g font-family="'Fira Code','Courier New',monospace" font-size="18" fill="#cdd6f4">
    <text x="36" y="68">
      <tspan fill="#6c7086">$ </tspan>./intro.sh
    </text>
    <text x="56" y="94" fill="url(#g)">Game Developer</text>
    <text x="56" y="118" fill="url(#g)">App Developer</text>
    <text x="56" y="142" fill="url(#g)">Always Learning</text>

    <text x="36" y="178">
      <tspan fill="#6c7086">$ </tspan>whoami
    </text>
    <text x="56" y="202" fill="#a6e3a1">Matěj Chaloupka</text>

    <text x="36" y="238">
      <tspan fill="#6c7086">$ </tspan>grep interests about.txt
    </text>
    <text x="56" y="262" fill="#89b4fa">programming, games, new technologies</text>

    <text x="36" y="298">
      <tspan fill="#6c7086">$ </tspan>cat contact.txt
    </text>
    <text x="56" y="322" fill="#f9e2af">chaloupkamatej1353@gmail.com</text>

    <text x="36" y="352">
      <tspan fill="#6c7086">$ </tspan>
      <tspan fill="#c9d1d9">▌
        <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
