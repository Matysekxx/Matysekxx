<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="Matysekxx banner">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7F52FF"/>
      <stop offset="0.5" stop-color="#3670A0"/>
      <stop offset="1" stop-color="#6DB33F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#7F52FF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#7F52FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="240" fill="#0d1117"/>
  <rect width="900" height="240" fill="url(#glow)"/>

  <!-- floating dots -->
  <g fill="#7F52FF">
    <circle cx="90"  cy="50"  r="3"><animate attributeName="cy" values="50;70;50" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="190" r="2.5"><animate attributeName="cy" values="190;170;190" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.2;1" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="60"  r="4"><animate attributeName="cy" values="60;40;60" dur="3.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.4;1;0.4" dur="3.5s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#3670A0">
    <circle cx="150" cy="120" r="2"><animate attributeName="cy" values="120;100;120" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;0.9;0.2" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="200" r="3"><animate attributeName="cy" values="200;180;200" dur="4.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;1;0.5" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="480" cy="40"  r="2"><animate attributeName="cy" values="40;60;40" dur="5.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.3;1;0.3" dur="5.5s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#6DB33F">
    <circle cx="650" cy="120" r="2.5"><animate attributeName="cy" values="120;140;120" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="60"  r="3"><animate attributeName="cy" values="60;80;60" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.3;1;0.3" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="150" r="2"><animate attributeName="cy" values="150;130;150" dur="6.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;1;0.5" dur="6.5s" repeatCount="indefinite"/></circle>
  </g>

  <text x="450" y="120" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="64" font-weight="800" fill="url(#g)">Matysekxx</text>
  <text x="450" y="165" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="22" letter-spacing="3" fill="#c9d1d9">GAME &amp; APPLICATION DEVELOPER</text>
  <rect x="350" y="190" width="200" height="4" rx="2" fill="url(#g)"/>
</svg>
