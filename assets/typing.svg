<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" width="620" height="200" role="img" aria-label="terminal window">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F52FF"/>
      <stop offset="100%" stop-color="#3670A0"/>
    </linearGradient>
    <linearGradient id="header" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
  </defs>

  <!-- window shadow -->
  <rect x="6" y="6" width="608" height="188" rx="12" fill="#000000" opacity="0.3"/>

  <!-- window body -->
  <rect x="0" y="0" width="608" height="188" rx="10" fill="#11111b" stroke="#313244" stroke-width="2"/>

  <!-- title bar -->
  <rect x="2" y="2" width="604" height="36" rx="8" fill="url(#header)"/>
  <rect x="2" y="28" width="604" height="10" fill="url(#header)"/>

  <!-- traffic light dots -->
  <circle cx="22" cy="20" r="6" fill="#f38ba8"/>
  <circle cx="42" cy="20" r="6" fill="#fab387"/>
  <circle cx="62" cy="20" r="6" fill="#a6e3a1"/>

  <!-- title -->
  <text x="304" y="26" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#585b70">zsh — Matysekxx</text>

  <!-- terminal lines -->
  <g font-family="'Fira Code','Courier New',monospace" font-size="24" fill="url(#g)">
    <text x="36" y="75">
      <tspan fill="#6c7086">$ </tspan>Game Developer
    </text>
    <text x="36" y="110">
      <tspan fill="#6c7086">$ </tspan>App Developer
    </text>
    <text x="36" y="145">
      <tspan fill="#6c7086">$ </tspan>Always Learning
      <tspan fill="#c9d1d9">▌
        <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
      </tspan>
    </text>
  </g>
</svg>
