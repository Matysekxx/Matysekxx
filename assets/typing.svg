<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 60" width="600" height="60" role="img" aria-label="animated intro">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7F52FF"/>
      <stop offset="100%" stop-color="#3670A0"/>
    </linearGradient>
    <style>
      .fade { animation: f 12s infinite; }
      .f1 { animation-delay: 0s; }
      .f2 { animation-delay: 4s; }
      .f3 { animation-delay: 8s; }
      @keyframes f {
        0%, 4% { opacity: 0; }
        8%, 29% { opacity: 1; }
        33%, 100% { opacity: 0; }
      }
      .blink { animation: b 0.8s infinite; }
      @keyframes b {
        50% { opacity: 0; }
      }
    </style>
  </defs>

  <g font-family="'Fira Code','Courier New',monospace" font-size="22" text-anchor="middle" fill="url(#g)">
    <text x="300" y="36" class="fade f1">
      <tspan fill="#7F52FF">&gt; </tspan>Game Developer
      <tspan class="blink" fill="#c9d1d9">▌</tspan>
    </text>
    <text x="300" y="36" class="fade f2">
      <tspan fill="#7F52FF">&gt; </tspan>App Developer
      <tspan class="blink" fill="#c9d1d9">▌</tspan>
    </text>
    <text x="300" y="36" class="fade f3">
      <tspan fill="#7F52FF">&gt; </tspan>Always Learning
      <tspan class="blink" fill="#c9d1d9">▌</tspan>
    </text>
  </g>
</svg>
