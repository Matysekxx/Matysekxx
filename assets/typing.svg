<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120" role="img" aria-label="typed lines">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F52FF"/>
      <stop offset="100%" stop-color="#3670A0"/>
    </linearGradient>
  </defs>

  <g font-family="'Fira Code','Courier New',monospace" font-size="20" fill="url(#g)">
    <text x="30" y="30">
      <tspan fill="#7F52FF">&gt; </tspan>Game Developer
    </text>
    <text x="30" y="60">
      <tspan fill="#7F52FF">&gt; </tspan>App Developer
    </text>
    <text x="30" y="90">
      <tspan fill="#7F52FF">&gt; </tspan>Always Learning
      <tspan fill="#c9d1d9">▌
        <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
      </tspan>
    </text>
